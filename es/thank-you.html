    <meta charset="UTF-8">

    <style>
        .thank-you-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .success-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 4rem 2rem;
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        .success-icon {
            font-size: 4rem;
            color: var(--color-accent);
            margin-bottom: 2rem;
            display: inline-block;
        }

        .success-card h1 {
            font-family: var(--font-primary);
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #fff, var(--color-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .success-card p {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <main class="thank-you-wrapper">
        <div class="success-card">
            <div class="success-icon">✓</div>
            <h1>Onboarding Completado</h1>
            <p>Gracias por compartir los detalles de su proyecto. Nuestro equipo técnico revisará su solicitud y nos pondremos en contacto en breve para definir los siguientes pasos.</p>
            <a href="profiles" class="btn btn-primary">Ir al Portal de Socio</a>
        </div>
