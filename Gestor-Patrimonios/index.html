<!DOCTYPE html>
<html lang="es-CR" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Elysium Patrimonio</title>
    <meta name="description" content="Gestor financiero personal de Elysium: movimientos, presupuestos, metas, simulador de compras y alertas.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#03060c" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Patrimonio">
    <meta name="application-name" content="Elysium Patrimonio">
    <meta name="format-detection" content="telephone=no">

    <link rel="manifest" href="/Gestor-Patrimonios/manifest.json">
    <link rel="icon" href="/Gestor-Patrimonios/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/Gestor-Patrimonios/icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/Gestor-Patrimonios/icons/apple-touch-icon.png">

    <script src="/Gestor-Patrimonios/js/boot.js"></script>
    <link rel="stylesheet" href="/Gestor-Patrimonios/css/tokens.css">
    <link rel="stylesheet" href="/Gestor-Patrimonios/css/base.css">
    <link rel="stylesheet" href="/Gestor-Patrimonios/css/components.css">
    <link rel="stylesheet" href="/Gestor-Patrimonios/css/views.css">
    <link rel="modulepreload" href="/Gestor-Patrimonios/js/app.js">
</head>
<body>
    <div class="splash" id="splash" role="status" aria-label="Cargando Elysium Patrimonio">
        <div class="splash-mark">
            <svg class="guilloche" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width=".6" aria-hidden="true">
                <circle cx="100" cy="100" r="94" stroke-opacity=".5"/>
                <circle cx="100" cy="100" r="86" stroke-dasharray="1 3"/>
                <circle cx="100" cy="100" r="70" stroke-opacity=".35"/>
            </svg>
            <b>λ</b>
        </div>
    </div>

    <div id="root"></div>
    <div id="overlays"></div>
    <div id="toasts"></div>

    <noscript>
        <div style="padding:40px;font-family:system-ui;color:#eef1f7;background:#03060c;min-height:100vh">
            Elysium Patrimonio necesita JavaScript para funcionar.
        </div>
    </noscript>

    <script type="module" src="/Gestor-Patrimonios/js/app.js"></script>
</body>
</html>
